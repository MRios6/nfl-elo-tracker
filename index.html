<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Elo Tracker & Predictor</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --card-border: #2c2c2c;
            --accent-blue: #007bff;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --home-color: #28a745;
            --away-color: #17a2b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        h2, h3 {
            color: #ffffff;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            background-color: #0056b3;
        }

        .status-box {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            text-align: center;
        }

        /* Game Prediction Card Styling */
        .matchup-card {
            background: #252525;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }

        .matchup-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }

        .teams-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            text-align: center;
            gap: 8px;
        }

        .team-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .team-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .team-name {
            font-weight: bold;
            font-size: 15px;
        }

        .team-prob {
            font-size: 18px;
            font-weight: bold;
            margin-top: 2px;
        }

        .vs-box {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: bold;
        }

        .spread-bar {
            background: #333;
            border-radius: 4px;
            height: 8px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
            display: flex;
        }

        .home-bar { background: var(--home-color); height: 100%; }
        .away-bar { background: var(--away-color); height: 100%; }

        .spread-text {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            margin-top: 6px;
            color: #fff;
        }

        /* Expandable Projected Stats Drawer */
        details {
            margin-top: 10px;
            background: #1a1a1a;
            border-radius: 6px;
            padding: 8px;
            border: 1px solid #2a2a2a;
        }

        summary {
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-blue);
            cursor: pointer;
            outline: none;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 12px;
        }

        .stats-table th, .stats-table td {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
        }

        .stats-table th {
            color: var(--text-muted);
            background: #222;
        }

        /* Leaderboard Table */
        .elo-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .elo-table th, .elo-table td {
            padding: 8px 4px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .elo-table th {
            background-color: #252525;
            color: var(--text-muted);
        }

        .elo-table td:first-child, .elo-table th:first-child {
            text-align: left;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>NFL Elo Engine</h2>

    <!-- Control Box -->
    <div class="card">
        <button onclick="syncFullSeasonData()">Fetch & Recalculate Season</button>
        <div id="status" class="status-box">Status: Ready</div>
    </div>

    <!-- Upcoming Games Predictions -->
    <div class="card">
        <h3 id="weekHeader">Upcoming Predictions</h3>
        <div id="gamesContainer">
            <p style="font-size:13px; color:#aaa; text-align:center;">Click the button above to calculate team Elos and fetch upcoming week matchups.</p>
        </div>
    </div>

    <!-- Rankings Table -->
    <div class="card">
        <h3>Team Elo Ratings</h3>
        <table class="elo-table">
            <thead>
                <tr>
                    <th>Team</th>
                    <th>Overall</th>
                    <th>Off</th>
                    <th>Def</th>
                    <th>Home</th>
                    <th>Away</th>
                </tr>
            </thead>
            <tbody id="eloBody"></tbody>
        </table>
    </div>

    <script>
        const K_OVERALL = 20;
        const K_STAT = 15;
        const HFA = 48; // Home Field Advantage in Elo points

        let teamData = {};
        let activeWeek = 1;

        function resetTeamData() {
            teamData = {};
        }

        function initTeam(abbr) {
            if (!teamData[abbr]) {
                teamData[abbr] = { overall: 1500, off: 1500, def: 1500, home: 1500, away: 1500, logo: '' };
            }
        }

        async function syncFullSeasonData() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Processing season (Weeks 1 to 18)...";
            
            resetTeamData();
            let totalGamesProcessed = 0;
            let detectedActiveWeek = 1;

            try {
                // Fetch weeks 1 to 18 sequentially
                for (let week = 1; week <= 18; week++) {
                    statusEl.innerText = `Analyzing Week ${week} boxscores...`;
                    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${week}`);
                    const data = await res.json();

                    if (data.events) {
                        let weekCompletedCount = 0;
                        data.events.forEach(event => {
                            const comp = event.competitions[0];
                            const home = comp.competitors.find(c => c.homeAway === 'home');
                            const away = comp.competitors.find(c => c.homeAway === 'away');

                            // Store logos for display
                            initTeam(home.team.abbreviation);
                            initTeam(away.team.abbreviation);
                            teamData[home.team.abbreviation].logo = home.team.logo;
                            teamData[away.team.abbreviation].logo = away.team.logo;

                            if (comp.status.type.completed) {
                                processGame(home, away);
                                totalGamesProcessed++;
                                weekCompletedCount++;
                            }
                        });

                        // Set active week to the first week that still has uncompleted games
                        if (weekCompletedCount === data.events.length && week < 18) {
                            detectedActiveWeek = week + 1;
                        }
                    }
                }

                activeWeek = detectedActiveWeek;
                localStorage.setItem('nfl_elo_data', JSON.stringify(teamData));
                localStorage.setItem('nfl_active_week', activeWeek);

                renderTable();
                await fetchUpcomingSchedule(activeWeek);

                statusEl.innerText = `Updated! ${totalGamesProcessed} completed games processed. Showing Week ${activeWeek}.`;
            } catch (err) {
                statusEl.innerText = "Error syncing season data.";
                console.error(err);
            }
        }

        function processGame(home, away) {
            const hAbbr = home.team.abbreviation;
            const aAbbr = away.team.abbreviation;

            const hScore = parseInt(home.score);
            const aScore = parseInt(away.score);

            // Fetch Yards safely from stats array
            const hYards = parseInt(home.statistics?.find(s => s.name === 'totalYards')?.displayValue || 330);
            const aYards = parseInt(away.statistics?.find(s => s.name === 'totalYards')?.displayValue || 330);

            // 1. Overall Elo Update
            const hElo = teamData[hAbbr].overall;
            const aElo = teamData[aAbbr].overall;
            const eHome = 1 / (1 + Math.pow(10, (aElo - (hElo + HFA)) / 400));
            const actualHome = hScore > aScore ? 1 : (hScore === aScore ? 0.5 : 0);

            const mov = Math.abs(hScore - aScore);
            const movMult = Math.log(mov + 1) * (2.2 / ((actualHome === 1 ? hElo - aElo : aElo - hElo) * 0.001 + 2.2));

            teamData[hAbbr].overall = Math.round(hElo + K_OVERALL * movMult * (actualHome - eHome));
            teamData[aAbbr].overall = Math.round(aElo + K_OVERALL * movMult * ((1 - actualHome) - (1 - eHome)));

            // 2. Offense & Defense Rating Splits
            const yardDiff = hYards - aYards;
            teamData[hAbbr].off += Math.round(K_STAT * (yardDiff / 100));
            teamData[aAbbr].def -= Math.round(K_STAT * (yardDiff / 100));

            // 3. Home vs Away Splits
            if (actualHome === 1) {
                teamData[hAbbr].home += 10;
                teamData[aAbbr].away -= 10;
            } else if (actualHome === 0) {
                teamData[hAbbr].home -= 10;
                teamData[aAbbr].away += 10;
            }
        }

        async function fetchUpcomingSchedule(week) {
            const container = document.getElementById('gamesContainer');
            document.getElementById('weekHeader').innerText = `Week ${week} Matchup Predictions`;
            container.innerHTML = 'Loading upcoming matchups...';

            try {
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${week}`);
                const data = await res.json();
                container.innerHTML = '';

                data.events.forEach(event => {
                    const comp = event.competitions[0];
                    const home = comp.competitors.find(c => c.homeAway === 'home');
                    const away = comp.competitors.find(c => c.homeAway === 'away');

                    const gameDate = new Date(event.date).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

                    renderMatchupCard(home, away, gameDate, comp.status.type.completed, container);
                });
            } catch (err) {
                container.innerHTML = 'Error loading schedule.';
                console.error(err);
            }
        }

        function renderMatchupCard(home, away, dateStr, isCompleted, container) {
            const hAbbr = home.team.abbreviation;
            const aAbbr = away.team.abbreviation;

            initTeam(hAbbr);
            initTeam(aAbbr);

            const hData = teamData[hAbbr];
            const aData = teamData[aAbbr];

            // 1. Elo Calculation Logic
            const eloDiff = (hData.off - aData.def) + (hData.def - aData.off) + HFA;
            const hWinProb = (1 / (1 + Math.pow(10, -eloDiff / 400)) * 100).toFixed(1);
            const aWinProb = (100 - hWinProb).toFixed(1);
            const spread = (eloDiff / 25).toFixed(1);

            let favorite = eloDiff > 0 ? hAbbr : aAbbr;
            let absSpread = Math.abs(spread);

            // 2. Predicted Matchup Stats Logic
            const projTotalPoints = Math.round(45.0 + 0.02 * (hData.off + aData.off - 3000));
            const projHScore = Math.round((projTotalPoints / 2) + (parseFloat(spread) / 2));
            const projAScore = Math.round((projTotalPoints / 2) - (parseFloat(spread) / 2));

            const projHYards = Math.round(330 + (hData.off - aData.def) * 0.8);
            const projAYards = Math.round(330 + (aData.off - hData.def) * 0.8);

            const projHYPP = (projHYards / 63).toFixed(1);
            const projAYPP = (projAYards / 63).toFixed(1);

            const projHTO = (1.25 - (hData.def - 1500) / 400).toFixed(1);
            const projATO = (1.25 - (aData.def - 1500) / 400).toFixed(1);

            const html = `
                <div class="matchup-card">
                    <div class="matchup-header">
                        <span>${dateStr}</span>
                        <span>${isCompleted ? 'FINAL' : 'UPCOMING'}</span>
                    </div>

                    <div class="teams-container">
                        <!-- Home Team -->
                        <div class="team-box">
                            <img src="${hData.logo || home.team.logo}" class="team-logo" alt="${hAbbr}">
                            <span class="team-name">${hAbbr} (H)</span>
                            <span class="team-prob" style="color: var(--home-color);">${hWinProb}%</span>
                        </div>

                        <div class="vs-box">VS</div>

                        <!-- Away Team -->
                        <div class="team-box">
                            <img src="${aData.logo || away.team.logo}" class="team-logo" alt="${aAbbr}">
                            <span class="team-name">${aAbbr}</span>
                            <span class="team-prob" style="color: var(--away-color);">${aWinProb}%</span>
                        </div>
                    </div>

                    <!-- Visual Win Prob Bar -->
                    <div class="spread-bar">
                        <div class="home-bar" style="width: ${hWinProb}%;"></div>
                        <div class="away-bar" style="width: ${aWinProb}%;"></div>
                    </div>

                    <div class="spread-text">
                        Projected Line: ${favorite} -${absSpread}
                    </div>

                    <!-- Stat Predictions Drawer -->
                    <details>
                        <summary>Predicted Stats & Matchup Breakdown</summary>
                        <table class="stats-table">
                            <thead>
                                <tr>
                                    <th>${hAbbr}</th>
                                    <th>Metric</th>
                                    <th>${aAbbr}</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><b>${projHScore}</b></td>
                                    <td>Projected Score</td>
                                    <td><b>${projAScore}</b></td>
                                </tr>
                                <tr>
                                    <td>${projHYards}</td>
                                    <td>Total Yards</td>
                                    <td>${projAYards}</td>
                                </tr>
                                <tr>
                                    <td>${projHYPP}</td>
                                    <td>Yards Per Play</td>
                                    <td>${projAYPP}</td>
                                </tr>
                                <tr>
                                    <td>${projHTO}</td>
                                    <td>Turnovers</td>
                                    <td>${projATO}</td>
                                </tr>
                                <tr>
                                    <td>${hData.off}</td>
                                    <td>Offensive Elo</td>
                                    <td>${aData.off}</td>
                                </tr>
                                <tr>
                                    <td>${hData.def}</td>
                                    <td>Defensive Elo</td>
                                    <td>${aData.def}</td>
                                </tr>
                            </tbody>
                        </table>
                    </details>
                </div>
            `;

            container.innerHTML += html;
        }

        function renderTable() {
            const tbody = document.getElementById('eloBody');
            tbody.innerHTML = '';
            
            const sortedTeams = Object.keys(teamData).sort((a,b) => teamData[b].overall - teamData[a].overall);

            sortedTeams.forEach(team => {
                const d = teamData[team];
                tbody.innerHTML += `<tr>
                    <td>${team}</td>
                    <td><b>${d.overall}</b></td>
                    <td>${d.off}</td>
                    <td>${d.def}</td>
                    <td>${d.home}</td>
                    <td>${d.away}</td>
                </tr>`;
            });
        }

        // Initialize state on boot
        let storedData = localStorage.getItem('nfl_elo_data');
        let storedWeek = localStorage.getItem('nfl_active_week');

        if (storedData) {
            teamData = JSON.parse(storedData);
            activeWeek = parseInt(storedWeek) || 1;
            renderTable();
            fetchUpcomingSchedule(activeWeek);
        }
    </script>
</body>
</html>
