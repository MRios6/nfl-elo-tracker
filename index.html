<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Elo Tracker & Predictor</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #e0e0e0; padding: 15px; margin: 0; }
        h2, h3 { color: #fff; margin-top: 15px; }
        .card { background: #1e1e1e; padding: 15px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; }
        button { background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { text-align: center; padding: 8px 4px; border-bottom: 1px solid #333; }
        th { background-color: #252525; color: #888; }
        td:first-child, th:first-child { text-align: left; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        select { width: 100%; padding: 10px; background: #252525; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 14px; }
        .pred-box { background: #252525; padding: 10px; border-radius: 6px; text-align: center; font-size: 15px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>NFL Elo Engine</h2>
    
    <div class="card">
        <button onclick="fetchLatestGames()">Fetch & Sync ESPN Boxscores</button>
        <p id="status" style="font-size: 12px; color: #aaa; margin-top: 8px; text-align: center;">Status: Ready</p>
    </div>

    <!-- Predictor Tool -->
    <div class="card">
        <h3>Game Matchup Predictor</h3>
        <div class="grid">
            <div>
                <label style="font-size: 12px;">Home Team</label>
                <select id="homeSelect" onchange="calculatePrediction()"></select>
            </div>
            <div>
                <label style="font-size: 12px;">Away Team</label>
                <select id="awaySelect" onchange="calculatePrediction()"></select>
            </div>
        </div>
        <div id="predictionResult" class="pred-box">Select two teams to see prediction</div>
    </div>

    <!-- Stats Table -->
    <div class="card">
        <h3>Team Elo Ratings</h3>
        <table>
            <thead>
                <tr>
                    <th>Team</th>
                    <th>Overall</th>
                    <th>Off</th>
                    <th>Def</th>
                    <th>Home</th>
                    <th>Away</th>
                </tr>
            </thead>
            <tbody id="eloBody"></tbody>
        </table>
    </div>

    <script>
        const K_OVERALL = 20;
        const K_STAT = 15;
        const HFA = 48; // Home Field Advantage in Elo points

        // Local Storage Initialization
        let teamData = JSON.parse(localStorage.getItem('nfl_elo_data')) || {};

        function initTeam(abbr) {
            if (!teamData[abbr]) {
                teamData[abbr] = { overall: 1500, off: 1500, def: 1500, home: 1500, away: 1500 };
            }
        }

        async function fetchLatestGames() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Syncing live game data...";
            
            try {
                const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
                const data = await response.json();
                
                let processedCount = 0;
                data.events.forEach(event => {
                    const comp = event.competitions[0];
                    if (comp.status.type.completed) {
                        const home = comp.competitors.find(c => c.homeAway === 'home');
                        const away = comp.competitors.find(c => c.homeAway === 'away');
                        processGame(home, away);
                        processedCount++;
                    }
                });

                localStorage.setItem('nfl_elo_data', JSON.stringify(teamData));
                renderTable();
                populateDropdowns();
                statusEl.innerText = `Updated! Processed ${processedCount} completed games.`;
            } catch (err) {
                statusEl.innerText = "Error fetching game data.";
                console.error(err);
            }
        }

        function processGame(home, away) {
            const hAbbr = home.team.abbreviation;
            const aAbbr = away.team.abbreviation;

            initTeam(hAbbr);
            initTeam(aAbbr);

            const hScore = parseInt(home.score);
            const aScore = parseInt(away.score);
            const hYards = parseInt(home.statistics?.find(s => s.name === 'totalYards')?.displayValue || 300);
            const aYards = parseInt(away.statistics?.find(s => s.name === 'totalYards')?.displayValue || 300);

            // 1. Calculate Overall Elo Update
            const hElo = teamData[hAbbr].overall;
            const aElo = teamData[aAbbr].overall;
            const eHome = 1 / (1 + Math.pow(10, (aElo - (hElo + HFA)) / 400));
            const actualHome = hScore > aScore ? 1 : (hScore === aScore ? 0.5 : 0);

            // Margin of Victory Multiplier
            const mov = Math.abs(hScore - aScore);
            const movMult = Math.log(mov + 1) * (2.2 / ((actualHome === 1 ? hElo - aElo : aElo - hElo) * 0.001 + 2.2));

            teamData[hAbbr].overall = Math.round(hElo + K_OVERALL * movMult * (actualHome - eHome));
            teamData[aAbbr].overall = Math.round(aElo + K_OVERALL * movMult * ((1 - actualHome) - (1 - eHome)));

            // 2. Offense & Defense Splits (Based on Yardage Differential)
            const yardDiff = hYards - aYards;
            teamData[hAbbr].off += Math.round(K_STAT * (yardDiff / 100));
            teamData[aAbbr].def -= Math.round(K_STAT * (yardDiff / 100));

            // 3. Home vs Away Splits
            if (actualHome === 1) {
                teamData[hAbbr].home += 10;
                teamData[aAbbr].away -= 10;
            } else if (actualHome === 0) {
                teamData[hAbbr].home -= 10;
                teamData[aAbbr].away += 10;
            }
        }

        function calculatePrediction() {
            const home = document.getElementById('homeSelect').value;
            const away = document.getElementById('awaySelect').value;
            const resBox = document.getElementById('predictionResult');

            if (!home || !away || home === away) {
                resBox.innerText = "Select two different teams.";
                return;
            }

            // Calculation using Offense vs Defense + Home Field Advantage
            const hOff = teamData[home].off;
            const aDef = teamData[away].def;
            const aOff = teamData[away].off;
            const hDef = teamData[home].def;

            const eloDiff = (hOff - aDef) + (hDef - aOff) + HFA;
            const winProb = (1 / (1 + Math.pow(10, -eloDiff / 400)) * 100).toFixed(1);
            const spread = (eloDiff / 25).toFixed(1);

            let favorite = eloDiff > 0 ? home : away;
            let absSpread = Math.abs(spread);

            resBox.innerHTML = `
                <b>${home} Win Probability: ${winProb}%</b><br>
                <span style="color:#aaa;">Projected Spread: ${favorite} -${absSpread}</span>
            `;
        }

        function populateDropdowns() {
            const hSelect = document.getElementById('homeSelect');
            const aSelect = document.getElementById('awaySelect');
            const teams = Object.keys(teamData).sort();

            hSelect.innerHTML = '<option value="">Select Home</option>';
            aSelect.innerHTML = '<option value="">Select Away</option>';

            teams.forEach(t => {
                hSelect.innerHTML += `<option value="${t}">${t}</option>`;
                aSelect.innerHTML += `<option value="${t}">${t}</option>`;
            });
        }

        function renderTable() {
            const tbody = document.getElementById('eloBody');
            tbody.innerHTML = '';
            
            const sortedTeams = Object.keys(teamData).sort((a,b) => teamData[b].overall - teamData[a].overall);

            sortedTeams.forEach(team => {
                const d = teamData[team];
                tbody.innerHTML += `<tr>
                    <td>${team}</td>
                    <td><b>${d.overall}</b></td>
                    <td>${d.off}</td>
                    <td>${d.def}</td>
                    <td>${d.home}</td>
                    <td>${d.away}</td>
                </tr>`;
            });
        }

        renderTable();
        populateDropdowns();
    </script>
</body>
</html>
